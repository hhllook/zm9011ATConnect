<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZM9011 路由器短信与调试台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">Z</div>
      <div>
        <div class="brand-name">ZM9011</div>
        <div class="brand-sub">路由器短信与调试台</div>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-page="sms">实时短信</button>
      <button class="nav-item" data-page="device">设备信息</button>
      <button class="nav-item" data-page="network">网络与信号</button>
      <button class="nav-item" data-page="logs">系统日志</button>
      <button class="nav-item" data-page="settings">设置与调试</button>
    </nav>
    <div class="sidebar-foot"><span id="sidebarStatus">连接中…</span></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title" id="pageTitle">实时短信</div>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">连接中…</span></div>
    </header>

    <main class="content">
      <!-- ================= 实时短信 ================= -->
      <section class="page page-sms active" id="page-sms">
        <div class="sms-layout" id="smsLayout">
          <aside class="inbox">
            <div class="inbox-head">
              <div class="inbox-title">
                <h2>收件箱</h2>
                <span class="count" id="inboxCount">0</span>
              </div>
              <div class="sms-status"><span class="dot" id="smsDot"></span><span id="smsStatus">串口未连接</span></div>
            </div>
            <div class="conv-list" id="conversationList"></div>
            <div class="empty" id="inboxEmpty">暂无短信，收到新短信后自动加载</div>
          </aside>

          <section class="thread-pane">
            <header class="thread-head">
              <button class="icon-btn back-btn" id="backBtn" title="返回会话列表">←</button>
              <div class="thread-sender" id="threadSender">选择会话</div>
              <div class="thread-actions">
                <button class="icon-btn" id="copyNumberBtn" title="复制号码">☎</button>
              </div>
            </header>
            <div class="thread-wrap">
              <div class="thread" id="thread"></div>
              <div class="empty thread-empty" id="threadEmpty">选择左侧会话查看短信</div>
            </div>
            <div class="composer">
              <button class="icon-btn" id="insertCodeBtn" title="插入当前会话的验证码" disabled>+</button>
              <div class="composer-input">
                <input id="replyInput" type="text" placeholder="短信" autocomplete="off">
                <span class="sim-badge" id="simBadge" hidden></span>
              </div>
              <button class="send-btn" id="sendBtn" title="发送短信" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2z" fill="currentColor"/></svg>
              </button>
            </div>
          </section>
        </div>
      </section>

      <!-- ================= 设备信息 ================= -->
      <section class="page" id="page-device">
        <div class="page-tools"><button class="btn" id="refreshDevice">刷新</button></div>
        <div class="info-grid" id="deviceGrid"></div>
      </section>

      <!-- ================= 网络与信号 ================= -->
      <section class="page" id="page-network">
        <div class="page-tools"><button class="btn" id="refreshNetwork">刷新</button></div>
        <div class="info-grid" id="networkGrid"></div>
      </section>

      <!-- ================= 系统日志 ================= -->
      <section class="page" id="page-logs">
        <div class="page-tools"><button class="btn" id="clearLogs">清空显示</button></div>
        <div class="log-list" id="logList"></div>
      </section>

      <!-- ================= 设置与调试 ================= -->
      <section class="page" id="page-settings">
        <div class="card settings-card">
          <h3>运行状态</h3>
          <div class="kv" id="settingsInfo"></div>
        </div>
        <div class="card">
          <h3>AT 调试</h3>
          <p class="hint">直接向模组发送 AT 指令，命令自动补 CR，返回原始响应。</p>
          <div class="at-row">
            <input id="atInput" type="text" placeholder="例如 AT+CGMR" autocomplete="off">
            <button class="btn-primary" id="atSend">发送</button>
          </div>
          <pre class="at-output" id="atOutput">等待命令…</pre>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
